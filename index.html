<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="description" content="Xpertise — votre coach endurance : suivi d'entraînement course à pied, trail et vélo, plans personnalisés et nutrition d'effort.">
  <title>Xpertise · Coach Endurance</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">X</span>
        <div class="brand-txt">
          <span class="brand-name">Xpertise</span>
          <span class="brand-sub" id="topbar-sub">Coach endurance</span>
        </div>
      </div>
      <button class="icon-btn" id="btn-add-quick" title="Ajouter une séance" aria-label="Ajouter une séance">+</button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" role="tablist" aria-label="Navigation principale">
      <button class="tab" data-route="dashboard" role="tab"><span class="tab-ico">◈</span><span>Accueil</span></button>
      <button class="tab" data-route="workouts" role="tab"><span class="tab-ico">⏱</span><span>Séances</span></button>
      <button class="tab" data-route="analysis" role="tab"><span class="tab-ico">📈</span><span>Analyse</span></button>
      <button class="tab" data-route="plan" role="tab"><span class="tab-ico">🎯</span><span>Plan</span></button>
      <button class="tab" data-route="nutrition" role="tab"><span class="tab-ico">🥤</span><span>Nutrition</span></button>
      <button class="tab" data-route="profile" role="tab"><span class="tab-ico">👤</span><span>Profil</span></button>
    </nav>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
