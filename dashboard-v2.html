<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <title>Xpertise · Dashboard bêta</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== Dashboard v2 — hub orbital interactif ===== */
    .v2 { max-width: 640px; margin: 0 auto; padding: 18px 14px calc(40px + env(safe-area-inset-bottom, 0px)); }
    .v2-back { display: inline-flex; align-items: center; gap: 6px; color: var(--txt-2); text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }

    /* --- Titre expressif multicolore --- */
    .v2-title { text-align: center; margin: 26px 0 4px; font-weight: 900; letter-spacing: -.5px; line-height: 1.15; font-size: clamp(26px, 8vw, 42px); }
    .v2-title span { display: inline-block; }
    .w-run   { color: #ff6b4a; transform: rotate(-2deg); }
    .w-plus  { color: var(--txt-3); font-weight: 700; font-size: .8em; }
    .w-trail { color: #a3e635; transform: rotate(1.5deg); }
    .w-bike  { color: #38bdf8; transform: rotate(-1deg); }
    .w-forme { color: #7c5cff; transform: rotate(1deg); }
    .w-nutri { color: #22d3ee; transform: rotate(-1.5deg); }
    .v2-sub { text-align: center; color: var(--txt-2); font-size: clamp(10.5px, 3.2vw, 13px); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin: 10px 0 6px; white-space: nowrap; }
    .v2-sub::before, .v2-sub::after { content: "——"; letter-spacing: -2px; margin: 0 8px; color: var(--txt-3); }
    .v2-hint { text-align: center; color: var(--accent-2); font-size: 11.5px; font-weight: 700; margin-top: 2px; }

    /* --- Hub orbital --- */
    .hub-wrap { position: relative; }
    .hub { position: relative; width: 100%; max-width: 480px; aspect-ratio: 1 / 1.05; margin: 44px auto 0; }
    .hub svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .hub-item, .hub-center { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
    .hub-item {
      position: absolute; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center;
      animation: bob 5s ease-in-out infinite;
      transition: opacity .18s ease;
      max-width: 108px;
    }
    .hub-item:nth-child(odd) { animation-delay: -2.5s; }
    @keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -7px; } }
    .hub.swapping .hub-item { opacity: 0; }
    .hub.swapping .hub-center { opacity: 0; }
    .hub-center { transition: opacity .18s ease; }
    .hub-tile {
      width: clamp(50px, 14vw, 64px); height: clamp(50px, 14vw, 64px);
      border-radius: 18px; display: grid; place-items: center;
      font-size: clamp(22px, 6.5vw, 28px);
      background: var(--card); border: 1px solid var(--line);
      box-shadow: 0 10px 26px rgba(3, 6, 18, .5);
      transition: transform .12s;
    }
    .hub-item:active .hub-tile { transform: scale(.9); }
    .hub-name { font-size: 11.5px; font-weight: 800; line-height: 1.15; }
    .hub-val { font-size: 10px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; line-height: 1.2; }
    .hv-run { color: #ff6b4a; } .hv-trail { color: #a3e635; } .hv-bike { color: #38bdf8; }
    .hv-rest { color: #93c5fd; } .hv-load { color: #fbbf24; } .hv-perf { color: #22d3ee; } .hv-muted { color: var(--txt-3); }
    .hub-center {
      position: absolute; left: 50%; top: 44.7%; transform: translate(-50%, -50%);
      width: clamp(118px, 33vw, 148px); height: clamp(118px, 33vw, 148px); border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      background: radial-gradient(circle at 30% 25%, rgba(124,92,255,.5), rgba(34,211,238,.15) 70%), var(--card-2);
      border: 1px solid rgba(124, 92, 255, .5);
      box-shadow: 0 0 60px rgba(124, 92, 255, .35), 0 18px 40px rgba(3,6,18,.6);
      text-align: center; padding: 8px;
    }
    .hub-center .c-ico { font-size: 26px; line-height: 1; }
    .hub-center .c-lab { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: var(--txt-2); text-transform: uppercase; }
    .hub-center .c-val { font-size: clamp(24px, 8vw, 34px); font-weight: 900; letter-spacing: -1px; background: var(--grad-hero); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.05; }
    .hub-center .c-tag { font-size: 10px; font-weight: 800; }
    .hub-back {
      position: absolute; left: 2px; top: -36px; z-index: 5;
      display: none; align-items: center; gap: 5px;
      background: var(--card); border: 1px solid rgba(124,92,255,.5); color: var(--txt);
      font-size: 12px; font-weight: 800; padding: 7px 13px; border-radius: 999px; cursor: pointer;
    }
    .hub-back.on { display: inline-flex; }

    /* --- Fiche détail sous le hub --- */
    .hub-detail { max-width: 480px; margin: 6px auto 0; }
    .hub-detail .card { animation: viewIn .25s ease; }
    .hd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .hd-grid .stat .v { font-size: 17px; }

    /* --- Mini-écrans --- */
    .screens { display: flex; gap: 10px; margin-top: 26px; overflow-x: auto; padding: 6px 2px 14px; scroll-snap-type: x mandatory; }
    .screens::-webkit-scrollbar { display: none; }
    .mini {
      flex: 0 0 150px; scroll-snap-align: start;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 10px 10px 12px; box-shadow: 0 12px 28px rgba(3,6,18,.45);
      display: flex; flex-direction: column; gap: 6px;
    }
    .mini h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--txt-3); font-weight: 800; }
    .mini .big { font-size: 17px; font-weight: 900; letter-spacing: -.3px; }
    .mini svg { width: 100%; height: auto; }
    .mini table { width: 100%; border-collapse: collapse; font-size: 9.5px; font-variant-numeric: tabular-nums; }
    .mini td { padding: 3px 2px; border-top: 1px solid var(--line); color: var(--txt-2); }
    .mini td b { color: var(--txt); }
    .mini .bars { display: grid; gap: 5px; }
    .mini .bars .brow { display: grid; grid-template-columns: 44px 1fr 26px; gap: 5px; align-items: center; font-size: 9px; color: var(--txt-2); font-weight: 700; }
    .mini .bars i { display: block; height: 8px; border-radius: 4px; }

    /* --- Badges bas --- */
    .v2-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 6px; margin-top: 16px; padding: 14px 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    .v2-badge { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; color: var(--txt-2); padding: 4px 10px; }
    .v2-badge + .v2-badge { border-left: 1px solid var(--line); }
    .v2-badge .bi { font-size: 17px; }

    .v2-cta { display: flex; justify-content: center; margin-top: 22px; }
    .v2-cta a {
      display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
      background: #eef2fb; color: #0b0f1a; font-weight: 900; font-size: 18px;
      padding: 14px 30px; border-radius: 999px; box-shadow: 0 14px 34px rgba(238,242,251,.18);
      transition: transform .15s;
    }
    .v2-cta a:active { transform: scale(.96); }
    .v2-note { text-align: center; color: var(--txt-3); font-size: 11.5px; margin-top: 14px; line-height: 1.6; }

    @media (prefers-reduced-motion: reduce) { .hub-item { animation: none !important; } }
  </style>
</head>
<body>
  <div class="v2">
    <a class="v2-back" href="./index.html#dashboard">← Xpertise classique</a>

    <h1 class="v2-title">
      <span class="w-run">COURSE</span> <span class="w-plus">+</span>
      <span class="w-trail">TRAIL</span> <span class="w-plus">+</span>
      <span class="w-bike">VÉLO</span><br>
      <span class="w-plus">+</span> <span class="w-forme">FORME</span>
      <span class="w-plus">+</span> <span class="w-nutri">NUTRITION</span>
    </h1>
    <div class="v2-sub">Ton tableau de bord complet</div>
    <div class="v2-hint">👆 Touchez une carte pour explorer · le centre pour revenir</div>

    <div class="hub-wrap">
      <div class="hub" id="hub"><button class="hub-back" id="hub-back-btn">←</button></div>
    </div>
    <div class="hub-detail" id="hub-detail"></div>

    <div class="screens" id="screens"></div>

    <div class="v2-badges">
      <div class="v2-badge"><span class="bi">📈</span>Charge<br>scientifique</div>
      <div class="v2-badge"><span class="bi">🎯</span>Plans<br>personnalisés</div>
      <div class="v2-badge"><span class="bi">🥤</span>Nutrition<br>d'effort</div>
    </div>

    <div class="v2-cta"><a href="./index.html#dashboard">🔗 Ouvrir l'app complète</a></div>
    <p class="v2-note" id="v2-note"></p>
  </div>

  <script type="module">
    import { db } from './js/db.js';
    import { fmt, currentFitness, weeklyStats, fitnessSeries, perfReference, predictionTable, workoutLoad, daysBetween, todayIso, estimateHrMax } from './js/metrics.js';
    import { fitnessChart, weeklyBars, donut, sparkline } from './js/charts.js';
    import { tsbLabel, coachContext } from './js/advice.js';

    let { workouts, profile, goal, plan } = db.get();
    let demo = false;

    // pas encore de données → jeu de démonstration (non enregistré)
    if (!workouts.length) {
      demo = true;
      const iso = o => { const d = new Date(); d.setDate(d.getDate() + o); return d.toISOString().slice(0, 10); };
      workouts = [];
      for (let wk = 9; wk >= 0; wk--) {
        const f = wk % 4 === 1 ? .6 : 1;
        workouts.push({ id: 'da' + wk, sport: 'run', date: iso(-wk * 7 - 5), title: 'VMA 8x400', durationMin: Math.round(55 * f), distanceKm: +(9.5 * f).toFixed(1), elevGain: 40, avgHr: 168 });
        workouts.push({ id: 'db' + wk, sport: 'run', date: iso(-wk * 7 - 3), title: 'Endurance fondamentale', durationMin: Math.round(50 * f), distanceKm: +(8 * f).toFixed(1), elevGain: 60, avgHr: 138 });
        if (wk % 2 === 0) workouts.push({ id: 'dc' + wk, sport: 'bike', date: iso(-wk * 7 - 2), title: 'Sortie vélo Z2', durationMin: Math.round(110 * f), distanceKm: Math.round(50 * f), elevGain: 450, avgHr: 130 });
        workouts.push({ id: 'dd' + wk, sport: wk % 3 === 0 ? 'trail' : 'run', date: iso(-wk * 7 - 1), title: wk % 3 === 0 ? 'Sortie longue trail' : 'Sortie longue', durationMin: Math.round((95 + (9 - wk) * 5) * f), distanceKm: +((14 + (9 - wk) * .8) * f).toFixed(1), elevGain: wk % 3 === 0 ? 700 : 120, avgHr: 146 });
        workouts.push({ id: 'dr' + wk, sport: 'rest', date: iso(-wk * 7), durationMin: 0, steps: 9000 });
      }
      workouts.push({ id: 'drace', sport: 'run', date: iso(-9), title: '10 km de Saint-Denis', durationMin: 41, distanceKm: 10, elevGain: 20, avgHr: 179, isRace: true });
      profile = { ...profile, hrMax: profile.hrMax || 190, hrRest: profile.hrRest || 52, weightKg: profile.weightKg || 68 };
    }
    workouts.sort((a, b) => b.date.localeCompare(a.date));

    const fit = currentFitness(workouts, profile);
    const tsb = tsbLabel(fit.tsb);
    const weeks = weeklyStats(workouts, profile, 8);
    const today = todayIso();
    const in28 = w => daysBetween(w.date, today) >= 0 && daysBetween(w.date, today) < 28;
    const cnt = s => workouts.filter(w => w.sport === s && in28(w)).length;
    const sum = (s, k) => Math.round(workouts.filter(w => w.sport === s && in28(w)).reduce((a, w) => a + (w[k] || 0), 0));
    const pref = perfReference(workouts, profile);
    const ctx = coachContext({ workouts, profile, goal, plan });
    const tagCol = { bad: '#f87171', warn: '#fbbf24', info: '#9fb0d0', good: '#34d399' };

    const SPORTS = {
      run: { ico: '🏃', name: 'Course', col: '#ff6b4a', cls: 'hv-run' },
      trail: { ico: '⛰️', name: 'Trail', col: '#a3e635', cls: 'hv-trail' },
      bike: { ico: '🚴', name: 'Vélo', col: '#38bdf8', cls: 'hv-bike' },
      rest: { ico: '😴', name: 'Repos', col: '#93c5fd', cls: 'hv-rest' },
    };

    // ================= Hub interactif =================
    const hubEl = document.getElementById('hub');
    const backBtn = document.getElementById('hub-back-btn');
    const detailEl = document.getElementById('hub-detail');
    const POS = [[50, 9], [13, 30], [87, 30], [16, 82], [84, 82]]; // top, gauche, droite, bas-g, bas-d
    const CENTER = [50, 47];

    function speedTxt(w) {
      if (!w.distanceKm || !w.durationMin) return '';
      return w.sport === 'bike' ? fmt.speed(w.distanceKm / (w.durationMin / 60)) : fmt.pace(w.durationMin / w.distanceKm);
    }

    function workoutSat(w) {
      const sp = SPORTS[w.sport];
      return {
        ico: w.isRace ? '🏁' : sp.ico,
        name: fmt.dateShort(w.date),
        val: w.sport === 'rest' ? (w.steps ? Math.round(w.steps / 1000) + 'k pas' : 'repos') : (w.distanceKm ? fmt.km(w.distanceKm) : fmt.dur(w.durationMin)),
        cls: sp.cls, col: sp.col,
        action: () => showWorkoutDetail(w),
      };
    }

    function rootState() {
      return {
        center: { ico: '', lab: 'Forme', val: (fit.tsb > 0 ? '+' : '') + Math.round(fit.tsb), tag: tsb.label, tagCol: tagCol[tsb.cls] },
        sats: [
          { ico: '🏃', name: 'Course', val: cnt('run') + ' séances', cls: 'hv-run', col: '#ff6b4a', action: () => go({ level: 'sport', sport: 'run' }) },
          { ico: '⛰️', name: 'Trail', val: sum('trail', 'elevGain') + ' m D+', cls: 'hv-trail', col: '#a3e635', action: () => go({ level: 'sport', sport: 'trail' }) },
          { ico: '🚴', name: 'Vélo', val: fmt.dur(sum('bike', 'durationMin')), cls: 'hv-bike', col: '#38bdf8', action: () => go({ level: 'sport', sport: 'bike' }) },
          { ico: '😴', name: 'Repos', val: cnt('rest') + ' jours', cls: 'hv-rest', col: '#93c5fd', action: () => go({ level: 'sport', sport: 'rest' }) },
          { ico: '⚡', name: 'Charge', val: 'CTL ' + fit.ctl, cls: 'hv-load', col: '#fbbf24', action: () => go({ level: 'charge' }) },
        ],
      };
    }

    function sportState(sport) {
      const sp = SPORTS[sport];
      const recent = workouts.filter(w => w.sport === sport).slice(0, 3);
      const sats = recent.map(workoutSat);
      if (sport === 'run' || sport === 'trail') {
        if (pref) sats.push({ ico: '⚡', name: 'Perf', val: 'VMA ' + pref.vma.toFixed(1), cls: 'hv-perf', col: '#22d3ee', action: () => showPerfDetail(sport) });
        sats.push({ ico: '📊', name: 'Stats 28 j', val: sum(sport, 'distanceKm') + ' km', cls: sp.cls, col: sp.col, action: () => showStatsDetail(sport) });
      } else if (sport === 'bike') {
        sats.push({ ico: '⚡', name: 'Perf', val: profile.ftp ? 'FTP ' + profile.ftp + ' W' : 'FTP ?', cls: 'hv-perf', col: '#22d3ee', action: () => showPerfDetail(sport) });
        sats.push({ ico: '📊', name: 'Stats 28 j', val: sum('bike', 'distanceKm') + ' km', cls: sp.cls, col: sp.col, action: () => showStatsDetail(sport) });
      } else { // rest
        const rests = workouts.filter(w => w.sport === 'rest' && in28(w));
        const avgSteps = rests.length ? Math.round(rests.reduce((a, w) => a + (w.steps || 0), 0) / rests.length) : 0;
        sats.push({ ico: '🚶', name: 'Pas moyens', val: avgSteps ? avgSteps.toLocaleString('fr-FR') : '—', cls: 'hv-rest', col: '#93c5fd', action: () => showRestDetail() });
        sats.push({ ico: '🔥', name: 'Sans repos', val: ctx.daysSinceRest + ' j', cls: ctx.daysSinceRest > 10 ? 'hv-load' : 'hv-muted', col: '#fbbf24', action: () => showRestDetail() });
      }
      const label28 = sport === 'rest' ? cnt('rest') + ' j / 28 j' : cnt(sport) + ' séances / 28 j';
      return {
        parent: 'root',
        center: { ico: sp.ico, lab: sp.name, val: String(sport === 'rest' ? cnt('rest') : cnt(sport)), tag: label28, tagCol: sp.col },
        sats,
      };
    }

    function chargeState() {
      const acCls = ctx.acRatio > 1.5 ? '#f87171' : ctx.acRatio > 1.3 ? '#fbbf24' : ctx.acRatio < 0.8 ? '#9fb0d0' : '#34d399';
      return {
        parent: 'root',
        center: { ico: '⚡', lab: 'Charge', val: String(fit.ctl), tag: 'CTL · fitness 42 j', tagCol: '#fbbf24' },
        sats: [
          { ico: '🔥', name: 'Fatigue', val: 'ATL ' + fit.atl, cls: 'hv-run', col: '#fb923c', action: () => showChargeDetail() },
          { ico: '🧘', name: 'Forme', val: 'TSB ' + (fit.tsb > 0 ? '+' : '') + fit.tsb, cls: 'hv-perf', col: '#34d399', action: () => showChargeDetail() },
          { ico: '⚖️', name: 'ACWR', val: String(ctx.acRatio), cls: 'hv-load', col: acCls, action: () => showChargeDetail() },
          { ico: '🔁', name: 'Monotonie', val: String(ctx.monotony), cls: ctx.monotony > 2 ? 'hv-run' : 'hv-muted', col: '#a78bfa', action: () => showChargeDetail() },
          { ico: '🎚️', name: '80/20', val: ctx.pctLowIntensity + '% facile', cls: ctx.pctLowIntensity < 70 ? 'hv-load' : 'hv-trail', col: '#a3e635', action: () => showChargeDetail() },
        ],
      };
    }

    let current = { level: 'root' };
    function stateFor(s) {
      if (s.level === 'sport') return sportState(s.sport);
      if (s.level === 'charge') return chargeState();
      return rootState();
    }

    function renderHub() {
      const st = stateFor(current);
      const [cx, cy] = CENTER;
      const wires = st.sats.map((s, i) => {
        const [x, y] = POS[i];
        const mx = cx + (x - cx) * 0.55, my = cy + (y - cy) * 0.55;
        return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(148,170,220,.28)" stroke-width=".45" stroke-dasharray="1.6 1.8"/>
          <circle cx="${mx}" cy="${my}" r="1.5" fill="${s.col}"/>
          <circle cx="${mx}" cy="${my}" r="2.6" fill="none" stroke="${s.col}" stroke-width=".35" opacity=".5"/>`;
      }).join('');
      hubEl.innerHTML = `
        <button class="hub-back ${st.parent ? 'on' : ''}" id="hub-back-btn">← Retour</button>
        <svg class="wires" viewBox="0 0 100 105" preserveAspectRatio="none">
          <circle cx="${cx}" cy="${cy}" r="26" fill="none" stroke="rgba(148,170,220,.2)" stroke-width=".4" stroke-dasharray="2 2.4"/>
          ${wires}
        </svg>
        ${st.sats.map((s, i) => `
          <div class="hub-item" data-i="${i}" style="left:${POS[i][0]}%;top:${POS[i][1] / 1.05}%">
            <div class="hub-tile">${s.ico}</div>
            <div class="hub-name">${s.name}</div>
            <div class="hub-val ${s.cls}">${s.val}</div>
          </div>`).join('')}
        <div class="hub-center" id="hub-center" title="${st.parent ? 'Revenir' : 'Votre forme'}">
          ${st.center.ico ? `<span class="c-ico">${st.center.ico}</span>` : ''}
          <span class="c-lab">${st.center.lab}</span>
          <span class="c-val">${st.center.val}</span>
          <span class="c-tag" style="color:${st.center.tagCol}">${st.center.tag}</span>
        </div>`;
      hubEl.querySelectorAll('.hub-item').forEach(el =>
        el.addEventListener('click', () => st.sats[+el.dataset.i]?.action?.()));
      hubEl.querySelector('#hub-center').addEventListener('click', () => { if (st.parent) go({ level: 'root' }); });
      hubEl.querySelector('#hub-back-btn')?.addEventListener('click', () => go({ level: 'root' }));
    }

    function go(next) {
      current = next;
      detailEl.innerHTML = '';
      hubEl.classList.add('swapping');
      setTimeout(() => { renderHub(); hubEl.classList.remove('swapping'); }, 190);
    }

    // ---------- Fiches détail ----------
    function detailCard(html) {
      detailEl.innerHTML = `<div class="card glow">${html}</div>`;
      detailEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showWorkoutDetail(w) {
      const sp = SPORTS[w.sport];
      if (w.sport === 'rest') {
        detailCard(`<h3>😴 Jour de repos · ${fmt.date(w.date)}</h3>
          <div class="hd-grid">
            <div class="stat"><span class="l">Pas</span><span class="v">${w.steps ? w.steps.toLocaleString('fr-FR') : '—'}</span></div>
            <div class="stat"><span class="l">Charge NEAT</span><span class="v">+${workoutLoad(w, profile)}</span></div>
            <div class="stat"><span class="l">Type</span><span class="v" style="font-size:13px">${w.steps > 6000 ? 'actif' : 'complet'}</span></div>
          </div>
          ${w.notes ? `<p class="muted mt12">📝 ${w.notes}</p>` : ''}`);
        return;
      }
      detailCard(`<h3>${w.isRace ? '🏁' : sp.ico} ${w.title || sp.name} <span class="badge" style="margin-left:6px">${fmt.date(w.date)}</span></h3>
        <div class="hd-grid">
          <div class="stat"><span class="l">Durée</span><span class="v">${fmt.dur(w.durationMin)}</span></div>
          <div class="stat"><span class="l">Distance</span><span class="v">${w.distanceKm ? fmt.km(w.distanceKm) : '—'}</span></div>
          <div class="stat"><span class="l">${w.sport === 'bike' ? 'Vitesse' : 'Allure'}</span><span class="v" style="font-size:14px">${speedTxt(w) || '—'}</span></div>
          <div class="stat"><span class="l">D+</span><span class="v">${w.elevGain ? w.elevGain + ' m' : '—'}</span></div>
          <div class="stat"><span class="l">FC moy</span><span class="v">${w.avgHr || '—'}</span></div>
          <div class="stat"><span class="l">Charge</span><span class="v">${workoutLoad(w, profile)}</span></div>
        </div>
        ${w.series?.hr ? `<div class="mt12">${sparkline(w.series.hr, { width: 420, height: 60, color: '#ff6b4a' })}</div>` : ''}
        ${w.series?.elev ? `<div class="mt8">${sparkline(w.series.elev, { width: 420, height: 60, color: '#a3e635' })}</div>` : ''}
        ${w.notes ? `<p class="muted mt8 small">📝 ${w.notes}</p>` : ''}
        <p class="mt12"><a href="./index.html#workouts" style="color:var(--accent-2);font-weight:700;font-size:13px;text-decoration:none">Ouvrir dans Mes séances →</a></p>`);
    }

    function showPerfDetail(sport) {
      if (sport === 'bike') {
        const wkg = profile.ftp && profile.weightKg ? (profile.ftp / profile.weightKg).toFixed(1) : null;
        detailCard(`<h3>⚡ Performance vélo</h3>
          <div class="hd-grid">
            <div class="stat"><span class="l">FTP</span><span class="v">${profile.ftp ? profile.ftp + ' W' : '—'}</span></div>
            <div class="stat"><span class="l">w/kg</span><span class="v">${wkg || '—'}</span></div>
            <div class="stat"><span class="l">28 j</span><span class="v">${fmt.dur(sum('bike', 'durationMin'))}</span></div>
          </div>
          ${!profile.ftp ? '<p class="muted mt12 small">Renseignez votre FTP (test 20 min) dans l\'onglet Analyse → Tests de terrain.</p>' : ''}`);
        return;
      }
      if (!pref) return;
      detailCard(`<h3>⚡ Performance ${sport === 'trail' ? 'trail' : 'course'}</h3>
        <p class="muted small">VMA ${pref.source === 'profile' ? 'du profil (test)' : 'estimée'} : <b style="color:var(--txt)">${pref.vma.toFixed(1)} km/h</b> · VO2max ≈ <b style="color:var(--txt)">${Math.round(pref.vma * 3.5)}</b> ml/min/kg</p>
        <div class="tbl-wrap mt12"><table class="tbl" style="min-width:0">
          <tr><th>Distance</th><th>Prédit</th></tr>
          ${predictionTable(pref.refDistKm, pref.refTimeMin).slice(0, 4).map(p =>
            `<tr><td>${p.label}</td><td><b>${fmt.durSec(p.timeMin * 60)}</b></td></tr>`).join('')}
        </table></div>`);
    }

    function showStatsDetail(sport) {
      const sp = SPORTS[sport];
      const list = workouts.filter(w => w.sport === sport && in28(w));
      const best = list.filter(w => w.distanceKm && w.durationMin).sort((a, b) => (b.distanceKm / b.durationMin) - (a.distanceKm / a.durationMin))[0];
      detailCard(`<h3>${sp.ico} ${sp.name} — 28 derniers jours</h3>
        <div class="hd-grid">
          <div class="stat"><span class="l">Séances</span><span class="v">${list.length}</span></div>
          <div class="stat"><span class="l">Distance</span><span class="v">${sum(sport, 'distanceKm')} km</span></div>
          <div class="stat"><span class="l">Temps</span><span class="v" style="font-size:15px">${fmt.dur(sum(sport, 'durationMin'))}</span></div>
          <div class="stat"><span class="l">D+</span><span class="v">${sum(sport, 'elevGain')} m</span></div>
          <div class="stat"><span class="l">FC moy</span><span class="v">${list.filter(w => w.avgHr).length ? Math.round(list.reduce((a, w) => a + (w.avgHr || 0), 0) / list.filter(w => w.avgHr).length) : '—'}</span></div>
          <div class="stat"><span class="l">Meilleure ${sport === 'bike' ? 'vitesse' : 'allure'}</span><span class="v" style="font-size:13px">${best ? speedTxt(best) : '—'}</span></div>
        </div>`);
    }

    function showRestDetail() {
      const rests = workouts.filter(w => w.sport === 'rest' && in28(w));
      const avgSteps = rests.length ? Math.round(rests.reduce((a, w) => a + (w.steps || 0), 0) / rests.length) : 0;
      detailCard(`<h3>😴 Récupération — 28 jours</h3>
        <div class="hd-grid">
          <div class="stat"><span class="l">Jours de repos</span><span class="v">${rests.length}</span></div>
          <div class="stat"><span class="l">Pas moyens</span><span class="v" style="font-size:16px">${avgSteps ? avgSteps.toLocaleString('fr-FR') : '—'}</span></div>
          <div class="stat"><span class="l">Sans repos</span><span class="v">${ctx.daysSinceRest} j</span></div>
        </div>
        <p class="muted mt12 small">${ctx.daysSinceRest > 13 ? '⚠️ Plus de 13 jours sans repos complet : planifiez-en un — c\'est pendant le repos que les adaptations se consolident.' : '✅ Rythme de récupération correct. Objectif : 1 jour de repos complet par semaine minimum.'}</p>`);
    }

    function showChargeDetail() {
      detailCard(`<h3>⚡ Charge d'entraînement</h3>
        <div class="hd-grid">
          <div class="stat"><span class="l">CTL fitness</span><span class="v">${fit.ctl}</span></div>
          <div class="stat"><span class="l">ATL fatigue</span><span class="v">${fit.atl}</span></div>
          <div class="stat"><span class="l">TSB forme</span><span class="v">${fit.tsb > 0 ? '+' : ''}${fit.tsb}</span></div>
          <div class="stat"><span class="l">ACWR</span><span class="v">${ctx.acRatio}</span></div>
          <div class="stat"><span class="l">Monotonie</span><span class="v">${ctx.monotony}</span></div>
          <div class="stat"><span class="l">Basse intensité</span><span class="v">${ctx.pctLowIntensity}%</span></div>
        </div>
        <p class="muted mt12 small">${tsb.text} Zone ACWR sûre : 0,8-1,3 · monotonie &lt; 2 · cible 80 % du temps en Z1-Z2. Détails et bulles ⓘ dans l'onglet Analyse.</p>`);
    }

    renderHub();

    // ================= Mini-écrans =================
    const series = fitnessSeries(workouts, profile, 60);
    const lastHr = workouts.find(w => w.series?.hr?.length)?.series.hr;
    const bySport = [
      { l: 'Course', v: sum('run', 'durationMin'), c: '#ff6b4a' },
      { l: 'Trail', v: sum('trail', 'durationMin'), c: '#a3e635' },
      { l: 'Vélo', v: sum('bike', 'durationMin'), c: '#38bdf8' },
    ];
    const maxSport = Math.max(1, ...bySport.map(b => b.v));

    document.getElementById('screens').innerHTML = `
      <div class="mini">
        <h4>Forme 60 j</h4>
        <span class="big" style="color:#7c5cff">CTL ${fit.ctl}</span>
        ${fitnessChart(series, { width: 260, height: 120 })}
      </div>
      <div class="mini">
        <h4>Volume hebdo</h4>
        <span class="big" style="color:#22d3ee">${fmt.dur(weeks.at(-1)?.durationMin || 0)}</span>
        ${weeklyBars(weeks.slice(-6), 'durationMin', { width: 260, height: 120, color: '#22d3ee' })}
      </div>
      <div class="mini">
        <h4>Répartition 28 j</h4>
        <div class="bars" style="margin-top:4px">
          ${bySport.map(b => `<div class="brow"><span>${b.l}</span><span style="background:rgba(148,170,220,.12);border-radius:4px"><i style="width:${Math.round(b.v / maxSport * 100)}%;background:${b.c}"></i></span><span>${Math.round(b.v / 60)}h</span></div>`).join('')}
        </div>
        <div style="display:flex;justify-content:center;margin-top:6px">${donut(bySport.map(b => ({ value: b.v, color: b.c })), { size: 86, stroke: 12 })}</div>
      </div>
      ${pref ? `<div class="mini">
        <h4>Prédictions</h4>
        <span class="big" style="color:#a3e635">VMA ${pref.vma.toFixed(1)}</span>
        <table>${predictionTable(pref.refDistKm, pref.refTimeMin).slice(0, 4).map(p =>
          `<tr><td>${p.label.replace(/ \(.*\)/, '')}</td><td style="text-align:right"><b>${fmt.durSec(p.timeMin * 60)}</b></td></tr>`).join('')}</table>
      </div>` : ''}
      ${lastHr ? `<div class="mini">
        <h4>Dernière FC</h4>
        <span class="big" style="color:#ff6b4a">♥ ${Math.max(...lastHr)} max</span>
        ${sparkline(lastHr, { width: 260, height: 90, color: '#ff6b4a' })}
      </div>` : `<div class="mini">
        <h4>Cette semaine</h4>
        <span class="big" style="color:#fbbf24">${weeks.at(-1)?.count || 0} séances</span>
        <table>
          <tr><td>Distance</td><td style="text-align:right"><b>${Math.round(weeks.at(-1)?.distanceKm || 0)} km</b></td></tr>
          <tr><td>D+</td><td style="text-align:right"><b>${Math.round(weeks.at(-1)?.elevGain || 0)} m</b></td></tr>
          <tr><td>Charge</td><td style="text-align:right"><b>${Math.round(weeks.at(-1)?.load || 0)}</b></td></tr>
          <tr><td>Repos</td><td style="text-align:right"><b>😴 ${weeks.at(-1)?.restCount || 0}</b></td></tr>
        </table>
      </div>`}
    `;

    document.getElementById('v2-note').textContent = demo
      ? 'Aperçu avec des données de démonstration — vos vraies données apparaîtront ici dès vos premières séances.'
      : 'Dashboard bêta alimenté par vos données réelles — dites-moi ce que vous en pensez !';
  </script>
</body>
</html>
